services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - APP_NAME="Video Analysis"
      - APP_DEBUG=false
      - APP_ENV=production
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_MAX_REQUESTS=60
      - RATE_LIMIT_TIME_WINDOW=60
      - PARSE_CACHE_TTL=86400
      - A_BOGUS_PORT=9876
      - DOUYIN_NODE_BIN=node
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    restart: unless-stopped
    # 资源限制（可选）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: '1'
