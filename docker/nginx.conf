server {
    listen 80 default_server;
    server_name _;
    root /app/public;
    index index.php;

    # 日志
    access_log /dev/stdout;
    error_log /dev/stderr;

    # 上传/请求体大小限制
    client_max_body_size 20m;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # 媒体下载路由（用 .mp4 路径避免浏览器识别为 .php）
    location /dl/ {
        rewrite ^/dl/(.+\.mp4)$ /index.php?action=media&download=1&filename=$1&$args last;
    }

    # API 请求转发到 PHP
    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    # 静态资源直接返回（浏览器缓存 7 天）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # OpenAPI 文档
    location = /openapi.yaml {
        try_files $uri =404;
    }

    # 其余请求交给 PHP 路由
    location / {
        try_files $uri /index.php?$query_string;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # 关缓冲，媒体流直出
        fastcgi_buffering off;
        fastcgi_read_timeout 900s;

        # 传递真实客户端 IP
        fastcgi_param REMOTE_ADDR $http_x_forwarded_for;
        fastcgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        fastcgi_param X-Forwarded-Proto $scheme;
    }

    # 处理后视频直出
    location ^~ /storage/processed/ {
        alias /app/storage/processed/;
        add_header Content-Type video/mp4;
    }

    # 安全：禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 安全：禁止访问敏感目录
    location ~ ^/(vendor|app|config|storage|scripts|bin)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
